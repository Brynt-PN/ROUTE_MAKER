{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Route Maker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
  <link rel="stylesheet" href="{% static 'CSS/styles.css' %}">
</head>
<body class="bg-dark">
  <nav class="navbar navbar-expand-lg bg-body-tertiary" data-bs-theme="dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="{% url 'RMapp:index' %}">Route Maker</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup" aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
        <span class="navbar-text ms-lg-3">{{ organization_name }}</span>
        <div class="navbar-nav ms-auto">
          <a class="nav-link" href="{% url 'accounts:logout' %}">Cerrar sesión</a>
          <a class="nav-link" href="https://github.com/Brynt-PN/ROUTE_MAKER"><img src="https://cdn.icon-icons.com/icons2/2429/PNG/512/github_logo_icon_147285.png" alt="logo GitHub" width="16"> Repositorio</a>
          <a class="nav-link" href="https://www.linkedin.com/in/brayant-palomino-navarro/"><img src="https://w7.pngwing.com/pngs/370/508/png-transparent-logo-linkedin-computer-icons-social-media-linked-angle-text-logo.png" alt="logo linkedin" width="16"> Autor</a>
        </div>
      </div>
    </div>
  </nav>

  <div class="container my-5 bg-color">
    {% if messages %}
    <div class="row">
      <div class="col-12 pt-3">
        {% for message in messages %}
        <div class="alert alert-{{ message.tags|default:'info' }} mb-0">{{ message }}</div>
        {% endfor %}
      </div>
    </div>
    {% endif %}

    <div class="row">
      <div class="col-sl-12 col-md-4 col-lg-4 col-xl-4 text-light py-3">
        <h2>Datos de Ruta</h2>
        <form action="{% url 'RMapp:create_routes' %}" method="POST" id="FA">
          {% csrf_token %}
          <div class="mb-3 autocomplete-field">
            <label for="Origin_form" class="form-label">Origen</label>
            <input type="text" class="form-control route-autocomplete" id="Origin_form" name="Origin_form" placeholder="Dirección de origen" autocomplete="off">
          </div>

          <div id="destinos">
            <div class="mb-3 autocomplete-field">
              <label for="Destino_form" class="form-label">Destino</label>
              <input type="text" class="form-control route-autocomplete Destino_input" id="Destino_form" name="Destino_form" placeholder="Dirección de destino" autocomplete="off">
            </div>
          </div>

          <div class="d-grid gap-2">
            <button class="btn btn-outline-secondary" type="button" id="Add-Detino-btn"><h5 class="text-light">Agregar Destino</h5></button>
          </div>

          <div class="d-grid gap-2 my-2">
            <button class="btn btn-light" type="button" id="RM"><h5>Generate Route</h5></button>
          </div>
        </form>
      </div>

      <div class="col-sl-12 col-md-8 col-lg-8 col-xl-8 bg-sec text-light py-3"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz" crossorigin="anonymous"></script>
  <script>
    window.routeMakerConfig = {
      autocompleteUrl: "{% url 'RMapp:autocomplete' %}"
    };
  </script>
  <script src="{% static 'JS/main.js' %}"></script>
</body>
</html>
